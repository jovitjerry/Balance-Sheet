[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    integration: needs a reachable MongoDB cluster. Applied automatically to any
        test using the `test_db` fixture. Skipped when Atlas is unreachable, unless
        --require-mongo is passed, which turns that skip into a failure.
    llm: needs a running Ollama with the configured model pulled. Applied
        automatically to any test using the `ollama_provider` fixture. Skipped when
        Ollama is unreachable, unless --require-ollama is passed, which turns that
        skip into a failure.
    benchmark: compares candidate local models. Opt-in and slow; never part of a
        normal run. Needs Ollama and every candidate model pulled.
    ocr: needs the Tesseract system binary. Applied automatically to any test using
        the `ocr_engine` fixture. Skipped when Tesseract is missing, unless
        --require-ocr is passed, which turns that skip into a failure.
filterwarnings =
    error::DeprecationWarning:app.*
